# Waypoint operation sequence for `ros2 run kanga_nav2 send_waypoints`
#
# Top-level:
# - operations: ordered list of actions to execute in sequence.
#
# Supported operation types:
# - type: goto
#   - x: required, map-frame X position in meters.
#   - y: required, map-frame Y position in meters.
#
# - type: spin
#   - degrees: optional, relative rotation amount in degrees.
#              Positive = CCW, negative = CW.
#              Default: 360.0 if omitted.
#   - time_allowance_sec: optional timeout for spin action.
#                         Default: 30.0.
#
# - type: face_yaw
#   - target_yaw_deg: required, absolute map-frame heading in degrees.
#                     0 = +X direction, 90 = +Y direction.
#   - time_allowance_sec: optional timeout for face-yaw action.
#                         Default: 30.0.
#
# Notes:
# - The loader still accepts legacy keys (`radians`, `target_yaw_rad`),
#   but prefer degree-based keys in this file.
operations:
  - type: face_yaw
    target_yaw_deg: 90.0

  - type: goto
    x: 0.0
    y: 3.5

  - type: face_yaw
    target_yaw_deg: 180.0

  - type: goto
    x: -10.0
    y: 3.5

  - type: spin
    degrees: 360.0

  - type: face_yaw
    target_yaw_deg: 0.0

  - type: goto
    x: 14.0
    y: 3.5

  - type: face_yaw
    target_yaw_deg: 90.0

  - type: goto
    x: 14.0
    y: 5.0

  - type: face_yaw
    target_yaw_deg: 153.435

  - type: goto
    x: 10.0
    y: 7.0

  - type: face_yaw
    target_yaw_deg: 129.805

  - type: goto
    x: 0.0
    y: 19.0

  - type: face_yaw
    target_yaw_deg: -50.194

  - type: goto
    x: 4.0
    y: 14.0

  - type: spin
    degrees: 360.0

  - type: face_yaw
    target_yaw_deg: -135.0

  - type: goto
    x: -1.5
    y: 8.5

  - type: spin
    degrees: 360.0

  - type: face_yaw
    target_yaw_deg: 135.0

  - type: goto
    x: -10.0
    y: 18.0

  - type: face_yaw
    target_yaw_deg: 90.0

  - type: goto
    x: -10.0
    y: 20.0

  - type: face_yaw
    target_yaw_deg: 0.0

  - type: goto
    x: 12.0
    y: 20.0

  - type: face_yaw
    target_yaw_deg: -104.03

  - type: goto
    x: 11.0
    y: 16.0

  - type: spin
    degrees: 360.0